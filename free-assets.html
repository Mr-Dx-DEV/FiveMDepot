<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Assets — FiveMDepot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .free-container { max-width: 1200px; margin: 120px auto 60px; padding: 0 24px; }
    .free-header { text-align: center; margin-bottom: 40px; }
    .free-header h1 { font-size: 2.5rem; margin-bottom: 12px; }
    .free-header p { color: var(--text-secondary); font-size: 1.125rem; }
    .free-filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 32px; }
    .free-filter-btn { padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-secondary); cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: all var(--duration-fast); }
    .free-filter-btn.active, .free-filter-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
    .free-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-bottom: 40px; }
    .free-card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; transition: all var(--duration-fast); }
    .free-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(249, 115, 22,0.1); }
    .free-card-img { width: 100%; height: 180px; object-fit: cover; background: var(--bg-input); }
    .free-card-body { padding: 20px; }
    .free-card-category { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .free-card-title { font-size: 1.0625rem; font-weight: 600; margin-bottom: 12px; }
    .free-card-title a { color: var(--text-primary); text-decoration: none; }
    .free-card-title a:hover { color: var(--gold); }
    .free-badge { display: inline-block; background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 12px; }
    .free-card-footer { display: flex; gap: 8px; margin-top: 16px; }
    .free-empty { text-align: center; padding: 60px 20px; background: var(--bg-card); border-radius: var(--radius-lg); border: 2px dashed var(--border); }
    .free-loading { text-align: center; padding: 60px; }
    .free-loading .loading-spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="/" class="navbar-logo">
        <svg viewBox="0 0 40 40" fill="none" width="36" height="36"><defs><linearGradient id="la" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#f97316"/><stop offset="50%" stop-color="#fb923c"/><stop offset="100%" stop-color="#f97316"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" stroke="url(#la)" stroke-width="2.5" fill="none"/><path d="M12 28V14l8 6 8-6v14" stroke="url(#la)" stroke-width="2.5" fill="none"/></svg>
        <span class="gradient-gold">FiveMDepot</span>
      </a>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="shop.html" class="btn btn-sm btn-outline-gold">Browse Shop</a>
      </div>
    </div>
  </nav>

  <div class="free-container">
    <div class="free-header">
      <h1>Free <span class="gradient-gold">Assets</span></h1>
      <p>Download quality free resources for your FiveM server</p>
    </div>
    <div class="free-filters" id="free-filters">
      <button class="free-filter-btn active" data-category="all">All</button>
    </div>
    <div id="free-content">
      <div class="free-loading"><div class="loading-spinner"></div><p>Loading free assets...</p></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 FiveMDepot. All rights reserved.</p></div>
  </footer>

  <script src="js/main.js"></script>
  <script>
  (function(){
    const content = document.getElementById('free-content');
    const filterContainer = document.getElementById('free-filters');
    let currentCategory = 'all';
    let allProducts = [];

    function renderProducts(products) {
      if (!products || products.length === 0) {
        content.innerHTML = '<div class="free-empty"><h3>No free assets found</h3><p>Check back soon for new free resources!</p></div>';
        return;
      }
      let html = '<div class="free-grid">';
      products.forEach(function(p) {
        const img = p.screenshots ? '<img class="free-card-img" src="'+(JSON.parse(p.screenshots||'[]')[0]||'')+'" alt="'+p.title+'">' : '<div class="free-card-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted)">🎁</div>';
        html += '<div class="free-card" data-category="'+p.category+'">'+img+'<div class="free-card-body"><div class="free-card-category">'+(p.category||'Asset')+'</div><span class="free-badge">FREE</span><div class="free-card-title"><a href="product.html?slug='+encodeURIComponent(p.slug)+'">'+p.title+'</a></div><div class="free-card-footer"><a href="product.html?slug='+encodeURIComponent(p.slug)+'" class="btn btn-sm btn-primary">View Details</a></div></div></div>';
      });
      html += '</div>';
      content.innerHTML = html;
    }

    function loadProducts(category) {
      content.innerHTML = '<div class="free-loading"><div class="loading-spinner"></div><p>Loading...</p></div>';
      fetch('api/products.php?action=free&category='+encodeURIComponent(category))
        .then(function(r){ return r.json(); })
        .then(function(data) {
          allProducts = data.products || [];
          renderProducts(allProducts);
        })
        .catch(function() { content.innerHTML = '<div class="free-empty"><h3>Failed to load</h3></div>'; });
    }

    fetch('api/products.php?action=categories')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        const cats = data.categories || [];
        filterContainer.innerHTML = '<button class="free-filter-btn active" data-category="all">All</button>';
        cats.forEach(function(c) {
          filterContainer.innerHTML += '<button class="free-filter-btn" data-category="'+c.name+'">'+c.name+'</button>';
        });
        filterContainer.querySelectorAll('.free-filter-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            filterContainer.querySelectorAll('.free-filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            loadProducts(currentCategory);
          });
        });
      });

    loadProducts('all');
  })();

  // Theme Toggle
  if (typeof ThemeToggle !== 'undefined') ThemeToggle.init();
  </script>
</body>
</html>
