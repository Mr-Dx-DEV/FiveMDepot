<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store — FiveMDepot</title>
  <meta name="robots" content="noindex">
  <script>
    // Old shop URL → new category page (shop.html?category=script&search=x → category.html?c=scripts&q=x)
    (function () {
      var p = new URLSearchParams(location.search);
      var map = { script: 'scripts', mlo: 'mlos-maps', vehicle: 'vehicles', all: 'all' };
      var c = map[(p.get('category') || 'all').toLowerCase()] || 'all';
      var q = p.get('search') || p.get('q') || '';
      location.replace('category.html?c=' + encodeURIComponent(c) + (q ? '&q=' + encodeURIComponent(q) : ''));
    })();
  </script>
  <link rel="canonical" href="category.html?c=all">
</head>
<body>
  <p><a href="category.html?c=all">Continue to the store</a></p>
</body>
</html>
