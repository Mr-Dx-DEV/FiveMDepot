<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Profile — FiveMDepot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .seller-container { max-width: 1200px; margin: 120px auto 60px; padding: 0 24px; }
    .seller-hero { background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border); overflow: hidden; margin-bottom: 40px; }
    .seller-banner { height: 200px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); position: relative; }
    .seller-banner::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: linear-gradient(to top, var(--bg-card), transparent); }
    .seller-info { display: flex; align-items: flex-start; gap: 24px; padding: 0 40px 32px; position: relative; margin-top: -50px; }
    .seller-avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--bg-card); background: var(--bg-input); overflow: hidden; flex-shrink: 0; }
    .seller-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .seller-details { flex: 1; padding-top: 60px; }
    .seller-name { font-size: 1.75rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; }
    .verified-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--gold); color: #000; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .seller-bio { color: var(--text-secondary); margin-bottom: 16px; max-width: 600px; }
    .seller-stats { display: flex; gap: 32px; margin-bottom: 20px; }
    .seller-stat { text-align: center; }
    .seller-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--gold); }
    .seller-stat-label { font-size: 0.8125rem; color: var(--text-muted); }
    .seller-contact { display: flex; gap: 12px; }
    .seller-products-section { margin-top: 40px; }
    .seller-products-section h2 { font-size: 1.5rem; margin-bottom: 24px; }
    .seller-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
    .seller-product-card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; transition: all var(--duration-fast); }
    .seller-product-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(249, 115, 22,0.1); }
    .seller-product-img { width: 100%; height: 160px; object-fit: cover; background: var(--bg-input); }
    .seller-product-body { padding: 16px; }
    .seller-product-title { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
    .seller-product-title a { color: var(--text-primary); text-decoration: none; }
    .seller-product-title a:hover { color: var(--gold); }
    .seller-product-price { font-size: 1.125rem; font-weight: 700; color: var(--gold); }
    .seller-loading { text-align: center; padding: 80px 20px; }
    .seller-loading .loading-spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .seller-empty { text-align: center; padding: 60px 20px; background: var(--bg-card); border-radius: var(--radius-lg); border: 2px dashed var(--border); }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="/" class="navbar-logo">
        <svg viewBox="0 0 40 40" fill="none" width="36" height="36"><defs><linearGradient id="la" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#f97316"/><stop offset="50%" stop-color="#fb923c"/><stop offset="100%" stop-color="#f97316"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" stroke="url(#la)" stroke-width="2.5" fill="none"/><path d="M12 28V14l8 6 8-6v14" stroke="url(#la)" stroke-width="2.5" fill="none"/></svg>
        <span class="gradient-gold">FiveMDepot</span>
      </a>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="shop.html" class="btn btn-sm btn-outline-gold">Browse Shop</a>
      </div>
    </div>
  </nav>

  <div class="seller-container" id="seller-container">
    <div class="seller-loading"><div class="loading-spinner"></div><p>Loading seller profile...</p></div>
  </div>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 FiveMDepot. All rights reserved.</p></div>
  </footer>

  <script src="js/main.js"></script>
  <script>
  (function(){
    const container = document.getElementById('seller-container');
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');

    if (!email) {
      container.innerHTML = '<div class="seller-empty"><h3>No seller specified</h3></div>';
      return;
    }

    fetch('api/seller.php?action=profile&email='+encodeURIComponent(email))
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (data.error) { container.innerHTML = '<div class="seller-empty"><h3>'+data.error+'</h3></div>'; return; }
        const s = data.seller;
        const verified = s.verified_badge ? '<span class="verified-badge">✓ Verified</span>' : '';
        const avatar = s.image ? '<img src="'+s.image+'" alt="'+s.name+'">' : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-input);color:var(--text-muted);font-size:2rem;">👤</div>';
        const bio = s.bio ? '<p class="seller-bio">'+s.bio+'</p>' : '';
        const discord = s.discord_tag ? '<span style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-input);padding:8px 16px;border-radius:20px;font-size:0.875rem;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>'+s.discord_tag+'</span>' : '';

        let html = '<div class="seller-hero"><div class="seller-banner"></div><div class="seller-info"><div class="seller-avatar">'+avatar+'</div><div class="seller-details"><div class="seller-name">'+s.name+' '+verified+'</div>'+bio+'<div class="seller-stats"><div class="seller-stat"><div class="seller-stat-value">'+(s.total_sales||0)+'</div><div class="seller-stat-label">Sales</div></div><div class="seller-stat"><div class="seller-stat-value">$'+(s.total_earnings?parseFloat(s.total_earnings).toFixed(0):'0')+'</div><div class="seller-stat-label">Earned</div></div><div class="seller-stat"><div class="seller-stat-value">'+(s.avg_rating?parseFloat(s.avg_rating).toFixed(1):'0')+'</div><div class="seller-stat-label">Rating</div></div><div class="seller-stat"><div class="seller-stat-value">'+(s.response_hours?parseFloat(s.response_hours).toFixed(0):'24')+'h</div><div class="seller-stat-label">Response</div></div></div><div class="seller-contact">'+discord+'</div></div></div></div>';

        if (s.products && s.products.length > 0) {
          html += '<div class="seller-products-section"><h2>Products ('+s.products.length+')</h2><div class="seller-products-grid">';
          s.products.forEach(function(p) {
            const img = p.image ? '<img class="seller-product-img" src="'+p.image+'" alt="'+p.title+'">' : '<div class="seller-product-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted)">No preview</div>';
            html += '<div class="seller-product-card">'+img+'<div class="seller-product-body"><div class="seller-product-title"><a href="product.html?slug='+encodeURIComponent(p.slug)+'">'+p.title+'</a></div><div class="seller-product-price">$'+p.price.toFixed(2)+'</div></div></div>';
          });
          html += '</div></div>';
        }

        container.innerHTML = html;
      })
      .catch(function() { container.innerHTML = '<div class="seller-empty"><h3>Failed to load seller profile</h3></div>'; });
  })();

  // Theme Toggle
  if (typeof ThemeToggle !== 'undefined') ThemeToggle.init();
  </script>
</body>
</html>
