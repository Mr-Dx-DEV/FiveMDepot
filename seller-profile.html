<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>try{var d=document.documentElement;if(localStorage.getItem('fivedepot_theme')==='light')d.setAttribute('data-theme','light');d.setAttribute('data-accent',localStorage.getItem('fdm_accent')||'crimson')}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller — FiveMDepot</title>
  <meta name="description" content="FiveM resources by this seller on FiveMDepot.">
  <meta name="theme-color" content="#0a0e17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/store.css?v=202610032258">
  <link rel="stylesheet" href="css/pages.css?v=202610032258">
</head>
<body>
  <div id="site-header"></div>
  <section class="page-hero" id="hero"><div class="container"><div class="skeleton" style="height:90px;max-width:520px"></div></div></section>
  <main class="container page-wrap"><div class="product-grid" id="grid"></div></main>
  <div id="site-footer"></div>
  <script src="js/store.js?v=202610032258"></script>
  <script>
  (function () {
    var S = window.Store, esc = S.esc;
    var id = new URLSearchParams(location.search).get('id') || '';
    S.api('seller', { id: id }).then(function (d) {
      var s = d.seller;
      document.title = s.name + ' — FiveMDepot seller';
      var joined = new Date(String(s.joined).replace(' ', 'T'));
      document.getElementById('hero').innerHTML = '<div class="container" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">' +
        '<span class="logo-mark" style="width:76px;height:76px;border-radius:20px;font-size:32px;color:#fff;font-weight:800;display:grid;place-items:center">' + esc(s.name.charAt(0).toUpperCase()) + '</span>' +
        '<div><nav class="crumbs"><a href="index.html">Home</a><span class="sep">/</span><span>Sellers</span></nav>' +
        '<h1>' + esc(s.name) + (s.official ? ' <span class="st st-ok" style="font-size:13px;vertical-align:middle">Official store</span>' : '') + '</h1>' +
        '<p>' + (s.bio ? esc(s.bio) : 'FiveM creator on FiveMDepot.') + '</p>' +
        '<p class="small">' + d.products.length + ' products · ' + (s.reviews ? '★ ' + s.rating + ' from ' + s.reviews + ' reviews · ' : '') + 'joined ' + (isNaN(joined) ? '' : joined.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })) +
        (s.discord ? ' · Discord: ' + esc(s.discord) : '') + '</p></div></div>';
      document.getElementById('grid').innerHTML = d.products.length ? d.products.map(S.productCard).join('') :
        '<div class="empty" style="grid-column:1/-1"><b>No products yet</b>Check back soon.</div>';
      S.syncWishlist();
    }).catch(function () {
      document.getElementById('hero').innerHTML = '<div class="container"><h1>Seller not found</h1><p><a class="link-more" href="category.html?c=all">Browse the store →</a></p></div>';
    });
  })();
  </script>
</body>
</html>
