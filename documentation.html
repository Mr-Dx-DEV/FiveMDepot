<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>try{var d=document.documentElement;if(localStorage.getItem('fivedepot_theme')==='light')d.setAttribute('data-theme','light');d.setAttribute('data-accent',localStorage.getItem('fdm_accent')||'crimson')}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docs — FiveMDepot</title>
  <meta name="description" content="FiveM guides, tutorials, tools and news from FiveMDepot.">
  <meta name="theme-color" content="#0a0e17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/store.css?v=202610031936">
  <link rel="stylesheet" href="css/pages.css?v=202610031936">
</head>
<body>
  <div id="site-header"></div>
  <main class="container page-wrap" id="docs"><div class="skeleton" style="height:300px"></div></main>
  <div id="site-footer"></div>
  <script src="js/store.js?v=202610031936"></script>
  <script>
  (function () {
    var S = window.Store, esc = S.esc, box = document.getElementById('docs');
    var q = new URLSearchParams(location.search);
    var TYPES = { blog: ['Blog', 'News, updates and server-owner stories.'], tutorial: ['Tutorials', 'Step-by-step guides for FiveM server owners.'],
                  tool: ['Tools', 'Free tools and utilities for your server.'], doc: ['Docs', 'Installation help, policies and documentation.'] };
    var type = TYPES[q.get('type')] ? q.get('type') : 'doc';
    var slug = q.get('slug');
    function date(s) { var d = new Date(String(s || '').replace(' ', 'T')); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }); }
    var tabs = '<div class="doc-tabs">' + Object.keys(TYPES).map(function (k) {
      return '<a class="subcat' + (k === type ? ' active' : '') + '" href="documentation.html?type=' + k + '">' + TYPES[k][0] + '</a>';
    }).join('') + '</div>';

    if (slug) {
      S.api('docs', { type: type, slug: slug }).then(function (d) {
        var a = d.article;
        document.title = a.title + ' — FiveMDepot';
        box.innerHTML = '<article class="article"><nav class="crumbs"><a href="index.html">Home</a><span class="sep">/</span><a href="documentation.html?type=' + esc(a.type) + '">' + TYPES[a.type][0] + '</a></nav>' +
          '<h1>' + esc(a.title) + '</h1><p class="muted small">' + (a.author ? 'By ' + esc(a.author) + ' · ' : '') + date(a.created_at) + ' · ' + a.views + ' views</p>' +
          (a.thumbnail && a.thumbnail.indexOf('cat-default') === -1 ? '<img class="article-cover" src="' + esc(a.thumbnail) + '" alt="">' : '') + '<div class="prose" style="margin-top:20px">' + a.content_html + '</div></article>';
      }).catch(function () {
        box.innerHTML = tabs + '<div class="empty"><b>Article not found</b>' + (['terms', 'privacy', 'refunds'].indexOf(slug) !== -1 ? 'This page hasn’t been written yet. Contact support for details.' : '') + '</div>';
      });
      return;
    }
    document.title = TYPES[type][0] + ' — FiveMDepot';
    S.api('docs', { type: type }).then(function (d) {
      box.innerHTML = '<span class="eyebrow">Resources</span><h1 class="section-title">' + TYPES[type][0] + '</h1><p class="section-sub">' + TYPES[type][1] + '</p>' + tabs +
        (d.articles.length ? '<div class="doc-grid">' + d.articles.map(function (a) {
          return '<a class="doc-card" href="documentation.html?type=' + esc(a.type) + '&slug=' + encodeURIComponent(a.slug) + '"><img src="' + esc(a.thumbnail || S.catArt({ slug: a.type === 'tool' ? 'scripts' : 'box' }, true)) + '" alt="" loading="lazy" data-fallback="images/store/cat-default.svg">' +
            '<div><span class="small muted">' + date(a.created_at) + (a.author ? ' · ' + esc(a.author) : '') + '</span><h3>' + esc(a.title) + '</h3>' + (a.excerpt ? '<p class="muted small">' + esc(a.excerpt) + '</p>' : '') + '</div></a>';
        }).join('') + '</div>' : '<div class="empty"><b>Nothing here yet</b>New ' + TYPES[type][0].toLowerCase() + ' are coming soon.</div>');
    }).catch(function () { box.innerHTML = tabs + '<div class="empty"><b>Could not load articles</b>Please try again later.</div>'; });
  })();
  </script>
</body>
</html>
