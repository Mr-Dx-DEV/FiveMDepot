<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation & Tutorials — FiveMDepot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .docs-container { max-width: 1200px; margin: 120px auto 60px; padding: 0 24px; }
    .docs-header { text-align: center; margin-bottom: 48px; }
    .docs-header h1 { font-size: 2.5rem; margin-bottom: 12px; }
    .docs-header p { color: var(--text-secondary); font-size: 1.125rem; }
    .docs-search { max-width: 500px; margin: 0 auto 40px; position: relative; }
    .docs-search input { width: 100%; padding: 16px 20px 16px 48px; border-radius: var(--radius-lg); background: var(--bg-input); border: 2px solid var(--border); color: var(--text-primary); font-size: 1rem; transition: border-color var(--duration-fast); }
    .docs-search input:focus { outline: none; border-color: var(--gold); }
    .docs-search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .docs-categories { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 40px; }
    .docs-cat-btn { padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-secondary); cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: all var(--duration-fast); }
    .docs-cat-btn.active, .docs-cat-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
    .docs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-bottom: 40px; }
    .docs-card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; transition: all var(--duration-fast); cursor: pointer; }
    .docs-card:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 12px 32px rgba(249, 115, 22,0.1); }
    .docs-card-img { width: 100%; height: 180px; object-fit: cover; background: var(--bg-input); }
    .docs-card-body { padding: 20px; }
    .docs-card-category { font-size: 0.75rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .docs-card-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 8px; }
    .docs-card-excerpt { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .docs-card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8125rem; color: var(--text-muted); }
    .docs-card-author { display: flex; align-items: center; gap: 8px; }
    .docs-card-author img { width: 24px; height: 24px; border-radius: 50%; }
    .docs-empty { text-align: center; padding: 60px 20px; background: var(--bg-card); border-radius: var(--radius-lg); border: 2px dashed var(--border); }
    .docs-loading { text-align: center; padding: 60px; }
    .docs-loading .loading-spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .doc-article { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 40px; margin-bottom: 40px; }
    .doc-article h1 { font-size: 2rem; margin-bottom: 16px; }
    .doc-article-meta { display: flex; gap: 24px; color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .doc-article-content { line-height: 1.8; color: var(--text-primary); }
    .doc-article-content h2 { font-size: 1.5rem; margin: 32px 0 16px; }
    .doc-article-content h3 { font-size: 1.25rem; margin: 24px 0 12px; }
    .doc-article-content p { margin-bottom: 16px; }
    .doc-article-content code { background: var(--bg-input); padding: 2px 8px; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 0.875rem; }
    .doc-article-content pre { background: var(--bg-input); padding: 20px; border-radius: var(--radius-md); overflow-x: auto; margin-bottom: 20px; }
    .doc-article-content pre code { background: none; padding: 0; }
    .doc-article-content ul, .doc-article-content ol { margin-bottom: 16px; padding-left: 24px; }
    .doc-article-content li { margin-bottom: 8px; }
    .doc-article-content blockquote { border-left: 4px solid var(--gold); padding: 16px 20px; background: rgba(249, 115, 22,0.05); border-radius: 0 var(--radius-md) var(--radius-md) 0; margin-bottom: 20px; }
    .doc-back { display: inline-flex; align-items: center; gap: 8px; color: var(--gold); text-decoration: none; margin-bottom: 24px; font-weight: 500; }
    .doc-back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="/" class="navbar-logo">
        <svg viewBox="0 0 40 40" fill="none" width="36" height="36"><defs><linearGradient id="la" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#f97316"/><stop offset="50%" stop-color="#fb923c"/><stop offset="100%" stop-color="#f97316"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="10" stroke="url(#la)" stroke-width="2.5" fill="none"/><path d="M12 28V14l8 6 8-6v14" stroke="url(#la)" stroke-width="2.5" fill="none"/></svg>
        <span class="gradient-gold">FiveMDepot</span>
      </a>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="shop.html" class="btn btn-sm btn-outline-gold">Browse Shop</a>
      </div>
    </div>
  </nav>

  <div class="docs-container" id="docs-container">
    <div class="docs-header">
      <h1>Documentation & <span class="gradient-gold">Tutorials</span></h1>
      <p>Learn how to set up, customize, and deploy FiveM resources</p>
    </div>
    <div class="docs-search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="docs-search" placeholder="Search documentation...">
    </div>
    <div class="docs-categories" id="docs-categories">
      <button class="docs-cat-btn active" data-category="all">All</button>
    </div>
    <div id="docs-content">
      <div class="docs-loading"><div class="loading-spinner"></div><p>Loading documentation...</p></div>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 FiveMDepot. All rights reserved.</p></div>
  </footer>

  <script src="js/main.js"></script>
  <script>
  (function(){
    const container = document.getElementById('docs-container');
    const content = document.getElementById('docs-content');
    const searchInput = document.getElementById('docs-search');
    const catContainer = document.getElementById('docs-categories');
    let currentCategory = 'all';
    let allDocs = [];

    function renderDocs(docs) {
      if (!docs || docs.length === 0) {
        content.innerHTML = '<div class="docs-empty"><h3>No documentation found</h3><p>Try a different search or category</p></div>';
        return;
      }
      let html = '<div class="docs-grid">';
      docs.forEach(function(doc) {
        const img = doc.thumbnail ? '<img class="docs-card-img" src="'+doc.thumbnail+'" alt="'+doc.title+'">' : '<div class="docs-card-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted)">📄</div>';
        const excerpt = doc.content ? doc.content.substring(0, 150).replace(/<[^>]*>/g, '') + '...' : 'No description available';
        html += '<div class="docs-card" data-slug="'+doc.slug+'">'+img+'<div class="docs-card-body"><div class="docs-card-category">'+doc.category+'</div><div class="docs-card-title">'+doc.title+'</div><div class="docs-card-excerpt">'+excerpt+'</div><div class="docs-card-meta"><span class="docs-card-author">'+(doc.author_name?'<img src="'+(doc.author_image||'')+'" alt="">'+doc.author_name:'Author')+'</span><span>'+doc.views+' views · '+formatDate(doc.created_at)+'</span></div></div></div>';
      });
      html += '</div>';
      content.innerHTML = html;

      content.querySelectorAll('.docs-card').forEach(function(card) {
        card.addEventListener('click', function() {
          window.location.href = 'documentation.html?slug='+this.dataset.slug;
        });
      });
    }

    function renderArticle(doc) {
      if (!doc) return;
      content.innerHTML = '<a href="documentation.html" class="doc-back">← Back to Documentation</a><div class="doc-article"><h1>'+doc.title+'</h1><div class="doc-article-meta"><span>By '+(doc.author_name||'Unknown')+'</span><span>'+doc.views+' views</span><span>Updated '+formatDate(doc.updated_at)+'</span></div><div class="doc-article-content">'+(doc.content||'<p>No content available</p>')+'</div></div>';
    }

    function loadDocs(category, search) {
      let url = 'api/documentation.php?action=list&category='+encodeURIComponent(category);
      if (search) url += '&search='+encodeURIComponent(search);
      content.innerHTML = '<div class="docs-loading"><div class="loading-spinner"></div><p>Loading...</p></div>';
      fetch(url).then(function(r){ return r.json(); }).then(function(data) {
        allDocs = data.documentation || [];
        renderDocs(allDocs);
      }).catch(function() { content.innerHTML = '<div class="docs-empty"><h3>Failed to load</h3></div>'; });
    }

    function loadCategories() {
      fetch('api/documentation.php?action=categories').then(function(r){ return r.json(); }).then(function(data) {
        const cats = data.categories || [];
        catContainer.innerHTML = '<button class="docs-cat-btn active" data-category="all">All</button>';
        cats.forEach(function(c) {
          catContainer.innerHTML += '<button class="docs-cat-btn" data-category="'+c.category+'">'+c.category+' ('+c.count+')</button>';
        });
        catContainer.querySelectorAll('.docs-cat-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            catContainer.querySelectorAll('.docs-cat-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            loadDocs(currentCategory, searchInput.value);
          });
        });
      });
    }

    let searchTimeout;
    searchInput.addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(function() { loadDocs(currentCategory, searchInput.value); }, 300);
    });

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    if (slug) {
      fetch('api/documentation.php?action=get&slug='+encodeURIComponent(slug)).then(function(r){ return r.json(); }).then(function(data) { renderArticle(data.documentation); });
    } else {
      loadCategories();
      loadDocs('all', '');
    }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }
  })();

  // Theme Toggle
  if (typeof ThemeToggle !== 'undefined') ThemeToggle.init();
  </script>
</body>
</html>
