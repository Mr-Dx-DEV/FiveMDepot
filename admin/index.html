<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — FiveMDepot</title>
  <meta name="theme-color" content="#0a0e17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/store.css">
  <link rel="stylesheet" href="app.css">
  <script>try{if(localStorage.getItem('fivedepot_theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
</head>
<body class="adm">
  <div class="adm-boot" id="boot"><span class="logo-mark"><span class="logo-ring"></span><svg viewBox="0 0 40 40"><path d="M11 29V12l9 7 9-7v17" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>

  <aside class="adm-side" id="side" aria-label="Admin navigation"></aside>
  <div class="adm-scrim" id="scrim"></div>

  <div class="adm-main">
    <header class="adm-top">
      <button class="icon-btn adm-menu" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="adm-search" id="searchBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search products, orders, users…</span><kbd>Ctrl K</kbd>
      </button>
      <div class="adm-top-right">
        <a class="btn btn-sm btn-ghost" href="../index.html" target="_blank" rel="noopener">View store ↗</a>
        <button class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="adm-user" id="userBox"></div>
      </div>
    </header>
    <main class="adm-page" id="page" tabindex="-1"></main>
  </div>

  <script src="app.js"></script>
  <script src="pages/dashboard.js"></script>
  <script src="pages/products.js"></script>
  <script src="pages/taxonomy.js"></script>
  <script src="pages/sales.js"></script>
  <script src="pages/site.js"></script>
  <script>Admin.start();</script>
</body>
</html>
