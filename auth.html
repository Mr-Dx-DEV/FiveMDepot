<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login or Register — FiveMDepot</title>
  <meta name="description" content="Sign in to your FiveMDepot account or create a new one.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-wrapper { min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(var(--header-height) + 40px) 24px 40px;background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,0.06) 0%,transparent 60%),var(--bg-primary); }
    .auth-card { width:100%;max-width:440px; }
    .auth-tabs { display:flex;gap:4px;margin-bottom:32px;background:var(--bg-input);border-radius:var(--radius-md);padding:4px; }
    .auth-tab { flex:1;padding:12px;text-align:center;border-radius:var(--radius-sm);font-weight:600;font-size:0.9375rem;cursor:pointer;transition:all var(--duration-fast);color:var(--text-secondary); }
    .auth-tab.active { background:var(--gold);color:#000; }
    .auth-tab:not(.active):hover { color:var(--gold); }
    .auth-form { display:none; }
    .auth-form.active { display:block;animation:fadeIn var(--duration-normal) var(--ease-out); }
    .auth-divider { display:flex;align-items:center;gap:16px;margin:24px 0;color:var(--text-muted);font-size:0.875rem; }
    .auth-divider::before,.auth-divider::after { content:'';flex:1;height:1px;background:var(--border); }
    .oauth-btn { width:100%;padding:12px;border-radius:var(--radius-md);font-weight:600;font-size:0.9375rem;display:flex;align-items:center;justify-content:center;gap:10px;transition:all var(--duration-fast);cursor:pointer;border:1px solid var(--border);background:var(--bg-input);color:var(--text-primary); }
    .oauth-btn:hover { border-color:var(--text-muted);transform:translateY(-1px); }
    .oauth-btn.discord { background:#5865F2;border-color:#5865F2;color:#fff; }
    .oauth-btn.discord:hover { background:#4752C4; }
    .oauth-btn.google { background:#fff;border-color:#fff;color:#333; }
    .oauth-btn.google:hover { background:#f0f0f0; }
    .form-group { margin-bottom:20px; }
    .form-group label { display:block;font-size:0.875rem;font-weight:500;color:var(--text-secondary);margin-bottom:8px; }
    .form-group input { width:100%;padding:12px 16px;border-radius:var(--radius-md);background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);font-size:0.9375rem;transition:border-color var(--duration-fast); }
    .form-group input:focus { outline:none;border-color:var(--gold); }
    .form-group input::placeholder { color:var(--text-muted); }
    .auth-error { padding:12px 16px;border-radius:var(--radius-md);background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#ef4444;font-size:0.875rem;margin-bottom:16px;display:none; }
    .auth-success { padding:12px 16px;border-radius:var(--radius-md);background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#22c55e;font-size:0.875rem;margin-bottom:16px;display:none; }
    .seller-toggle { display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius-md);background:var(--bg-input);border:1px solid var(--border);margin-bottom:20px;cursor:pointer; }
    .seller-toggle input { width:18px;height:18px;accent-color:var(--gold);cursor:pointer; }
    .seller-toggle label { font-size:0.9375rem;color:var(--text-secondary);cursor:pointer; }
  </style>
</head>
<body>

  <!-- Navbar (simplified) -->
  <nav class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="/" class="navbar-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="36" height="36">
          <defs><linearGradient id="la" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#d4af37"/><stop offset="50%" stop-color="#f0c75e"/><stop offset="100%" stop-color="#d4af37"/></linearGradient></defs>
          <rect x="2" y="2" width="36" height="36" rx="10" stroke="url(#la)" stroke-width="2.5" fill="none"/>
          <path d="M12 28V14l8 6 8-6v14" stroke="url(#la)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span class="gradient-gold">FiveMDepot</span>
      </a>
      <div class="navbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="shop.html" class="btn btn-sm btn-outline-gold">Browse Shop</a>
      </div>
    </div>
  </nav>

  <!-- Auth -->
  <div class="auth-wrapper">
    <div class="auth-card reveal-scale">
      <div style="text-align:center;margin-bottom:32px;">
        <h1 class="heading-md" style="margin-bottom:8px;">
          Welcome to <span class="gradient-gold">FiveMDepot</span>
        </h1>
        <p class="text-secondary">Sign in or create an account to get started</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Sign In</div>
        <div class="auth-tab" data-tab="register">Create Account</div>
      </div>

      <!-- Error / Success -->
      <div class="auth-error" id="auth-error"></div>
      <div class="auth-success" id="auth-success"></div>

      <!-- Login Form -->
      <div class="auth-form active" id="login-form">
        <form action="api/auth.php?action=login" method="POST">
          <input type="hidden" name="csrf_token" id="login-csrf" value="">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Your password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        </form>
        <div class="auth-divider">or continue with</div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <a href="api/auth.php?action=discord" class="oauth-btn discord">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            Continue with Discord
          </a>
          <a href="api/auth.php?action=google" class="oauth-btn google">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0124 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 38.595 16.11 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
            Continue with Google
          </a>
        </div>
      </div>

      <!-- Register Form -->
      <div class="auth-form" id="register-form">
        <form action="api/auth.php?action=register" method="POST">
          <input type="hidden" name="csrf_token" id="register-csrf" value="">
          <div class="form-group">
            <label for="reg-name">Name</label>
            <input type="text" id="reg-name" name="name" placeholder="Your name" required minlength="1" maxlength="100">
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" placeholder="Minimum 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" name="confirm_password" placeholder="Repeat your password" required minlength="6">
          </div>
          <div class="seller-toggle">
            <input type="checkbox" id="want-sell" name="want_seller">
            <label for="want-sell">I want to sell assets on FiveMDepot</label>
          </div>
          <div class="seller-toggle">
            <input type="checkbox" id="newsletter-opt" name="newsletter_opt_in">
            <label for="newsletter-opt">Subscribe to our newsletter for updates &amp; free assets</label>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
  (function(){
    // Fetch CSRF token from server
    fetch('api/auth.php?action=csrf')
      .then(function(r){ return r.json(); })
      .then(function(data){
        document.getElementById('login-csrf').value = data.csrf_token;
        document.getElementById('register-csrf').value = data.csrf_token;
      })
      .catch(function(){
        // Fallback: generate local token if server is unavailable
        var arr = new Uint32Array(16);
        crypto.getRandomValues(arr);
        var token = Array.from(arr, function(v){return v.toString(36);}).join('');
        document.getElementById('login-csrf').value = token;
        document.getElementById('register-csrf').value = token;
      });

    // Tabs
    $$('.auth-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        $$('.auth-tab').forEach(function(t){t.classList.remove('active');});
        $$('.auth-form').forEach(function(f){f.classList.remove('active');});
        this.classList.add('active');
        document.getElementById(this.dataset.tab+'-form').classList.add('active');
      });
    });

    // Login form submit handler
    var loginForm = document.getElementById('login-form').querySelector('form');
    if(loginForm) {
      loginForm.addEventListener('submit', function(e){
        e.preventDefault();
        var err = document.getElementById('auth-error');
        err.style.display = 'none';
        err.textContent = '';
        var btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        var fd = new FormData(this);
        fetch('api/auth.php?action=login', {
          method: 'POST',
          body: fd
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.success) {
            window.location.href = data.redirect;
          } else {
            err.textContent = data.error || 'Login failed';
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign In';
          }
        })
        .catch(function(){
          err.textContent = 'Network error. Please try again.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        });
      });
    }

    // Register form submit handler
    var regForm = document.getElementById('register-form').querySelector('form');
    if(regForm) {
      regForm.addEventListener('submit', function(e){
        e.preventDefault();
        var p = document.getElementById('reg-password').value;
        var c = document.getElementById('reg-confirm').value;
        if(p !== c) {
          var err = document.getElementById('auth-error');
          err.textContent = 'Passwords do not match';
          err.style.display = 'block';
          return;
        }
        var err = document.getElementById('auth-error');
        err.style.display = 'none';
        err.textContent = '';
        var btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        var fd = new FormData(this);
        fetch('api/auth.php?action=register', {
          method: 'POST',
          body: fd
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.success) {
            window.location.href = data.redirect;
          } else {
            err.textContent = data.error || 'Registration failed';
            err.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create Account';
          }
        })
        .catch(function(){
          err.textContent = 'Network error. Please try again.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account';
        });
      });
    }

    // Cookie Consent
    if (typeof CookieConsent !== 'undefined') CookieConsent.init();

    // Theme Toggle
    if (typeof ThemeToggle !== 'undefined') ThemeToggle.init();
  })();
  </script>
</body>
</html>
